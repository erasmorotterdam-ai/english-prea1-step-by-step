const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const FEMALE_NAMES=/\b(jenny|aria|sara|samantha|victoria|ava|allison|susan|zira|hazel|libby|sonia|natasha|emma|olivia|joanna|kendra|kimberly|salli|ivy|amy|nicole|female|woman)\b/i;
function femaleScore(v){return (FEMALE_NAMES.test(v.name)?100:0)+score(v)}
function setFemale(role){if(!voices.length){alert('Todavía no hay voces disponibles. Espera unos segundos e inténtalo otra vez.');return}const candidates=voices.map((v,i)=>({v,i})).filter(x=>FEMALE_NAMES.test(x.v.name)).sort((a,b)=>femaleScore(b.v)-femaleScore(a.v));if(!candidates.length){alert('El navegador no identifica voces femeninas por nombre. Puedes elegir una voz y escucharla desde la lista.');return}const other=role==='A'?voiceBIndex:voiceIndex;const choice=candidates.find(x=>x.i!==other)||candidates[0];chooseVoice(choice.i,role);voiceControls();speak('Hello! Welcome to your English lesson.',null,role)}
function getVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));voices.sort((a,b)=>score(b)-score(a));let saved=db.voice||'';voiceIndex=voices.findIndex(v=>v.name===saved);if(voiceIndex<0)voiceIndex=0;let savedB=db.voiceB||'';voiceBIndex=voices.findIndex(v=>v.name===savedB);if(voiceBIndex<0||voiceBIndex===voiceIndex)voiceBIndex=voices.findIndex((v,i)=>i!==voiceIndex&&v.name!==voices[voiceIndex]?.name);if(voiceBIndex<0)voiceBIndex=voiceIndex;if($('voice'))voiceControls()}
function score(v){return (/en-US/i.test(v.lang)?10:0)+(/natural|neural|premium|enhanced/i.test(v.name)?8:0)+(/online/i.test(v.name)?2:0)}
if('speechSynthesis'in window){getVoices();speechSynthesis.addEventListener?.('voiceschanged',getVoices)}
function voiceControls(){for(let [id,idx] of [['voice',voiceIndex],['voiceB',voiceBIndex]]){let el=$(id);if(!el)continue;el.innerHTML=voices.map((v,i)=>`<option value="${i}" ${i===idx?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')||'<option value="-1">Voz predeterminada</option>'}}
function chooseVoice(i,role='A'){if(role==='B'){voiceBIndex=Number(i);db.voiceB=voices[voiceBIndex]?.name||''}else{voiceIndex=Number(i);db.voice=voices[voiceIndex]?.name||''}save()}
function speak(t,rate,role='A'){return sayLines([{text:t,role}],rate)}
function stop(){busy=false;try{speechSynthesis.cancel()}catch(e){}}
function sayLines(lines,rate){if(!('speechSynthesis'in window))return;stop();busy=true;let index=0;function next(){if(!busy)return;if(index>=lines.length){busy=false;return}let item=lines[index++],u=new SpeechSynthesisUtterance(item.text);u.lang='en-US';let vi=item.role==='B'?voiceBIndex:voiceIndex;if(voices[vi])u.voice=voices[vi];u.rate=rate||(slow?.75:.94);u.pitch=item.role==='B'?1.04:1;u.onend=()=>{if(busy)next()};u.onerror=()=>{busy=false};speechSynthesis.speak(u)}next()}

const GLOBAL_GLOSS={"i":"yo","you":"tú / usted","we":"nosotros","they":"ellos","my":"mi","your":"tu / su","the":"el / la (según contexto)","a":"un / una","an":"un / una","is":"es / está","are":"son / están","do":"hacer (auxiliar en preguntas)","does":"auxiliar de pregunta","can":"poder","could":"podría","please":"por favor","thank you":"gracias","what":"qué / cuál","where":"dónde","when":"cuándo","how":"cómo","need":"necesitar","help":"ayuda / ayudar","work":"trabajo / trabajar","usually":"normalmente","after":"después de","before":"antes de","go home":"ir a casa","get up":"levantarse","take a break":"tomar un descanso","check in":"registrarse","fill out":"completar un formulario","running late":"llevar retraso","give me a hand":"echarme una mano","on my break":"en mi descanso","shift":"turno de trabajo","job site":"obra / lugar de trabajo","front desk":"recepción","time off":"tiempo libre / permiso laboral","paycheck":"pago / cheque de nómina","coworker":"compañero de trabajo","supervisor":"supervisor"};
let dictionaryEnabled=true;
function glossMap(){const m={...GLOBAL_GLOSS};const u=UNITS[unit];if(u)for(const [w,es] of u.words)m[w.toLowerCase()]=es;return m}
function glossify(root){if(!root||!dictionaryEnabled)return;const map=glossMap(),terms=Object.keys(map).sort((a,b)=>b.length-a.length);const re=new RegExp('(?<![\\p{L}])('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}])','giu');const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){return n.parentElement?.closest('button,a,select,option,textarea,input,script,style,.gloss-word,.muted,.hint')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){let txt=n.nodeValue;re.lastIndex=0;if(!re.test(txt))continue;re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,match;while((match=re.exec(txt))){frag.appendChild(document.createTextNode(txt.slice(last,match.index)));const span=document.createElement('span');span.className='gloss-word';span.tabIndex=0;span.dataset.meaning=map[match[0].toLowerCase()];span.textContent=match[0];span.setAttribute('aria-label',match[0]+': '+span.dataset.meaning);frag.appendChild(span);last=re.lastIndex}frag.appendChild(document.createTextNode(txt.slice(last)));n.replaceWith(frag)}}
function showGloss(el){const pop=document.getElementById('gloss-popup');if(!pop)return;pop.innerHTML='<b>'+esc(el.textContent)+'</b><div>'+esc(el.dataset.meaning)+'</div><button type="button" id="gloss-audio">▶ Pronunciación</button>';pop.hidden=false;const r=el.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(innerWidth-250,r.left))+'px';pop.style.top=Math.min(innerHeight-110,r.bottom+7)+'px';document.getElementById('gloss-audio').onclick=()=>speak(el.textContent)}
document.addEventListener('mouseover',e=>{const el=e.target.closest?.('.gloss-word');if(el)showGloss(el)});
document.addEventListener('focusin',e=>{const el=e.target.closest?.('.gloss-word');if(el)showGloss(el)});
document.addEventListener('click',e=>{const el=e.target.closest?.('.gloss-word');if(el)showGloss(el);else if(!e.target.closest?.('#gloss-popup')){const pop=document.getElementById('gloss-popup');if(pop)pop.hidden=true}});

function openUnit(i,k){stop();unit=Number(i);step=Number(k);exercise=0;answer=null;sim=0;simAnswer=null;feedback='';hintLevel=0;phraseIdx=0;variantTemplate=0;variantChoice=0;showText=false;turn=0;conversationLog=[];heard='';spokenTurn=false;speakingComplete=false;render();autoStartActivity()}

function render(){let u=UNITS[unit],d=DIALOGUES[unit],body='';if(step===0)body=meta(u);if(step===1)body=listen(u,d);if(step===2)body=phrases(u);if(step===3)body=practice(u,d);if(step===4)body=dialog(u,d);if(step===5)body=yourTurn(u,d);if(step===6)body=finish(u);$('app').innerHTML=head()+`<div class="card"><div class="row" style="justify-content:space-between"><b>Unit ${unit<20?unit+1:"21."+(unit-19)} · ${esc(u.title)}</b><span>${step+1}/7 · ${STEPS[step]}</span></div><div class="bars">${STEPS.map((_,i)=>`<button aria-label="${STEPS[i]}" class="bar ${i===step?'active':db.done[unit+'-'+i]?'done':''}" onclick="stop();step=${i};render();autoStartActivity()"></button>`).join('')}</div></div>`+body+`<div class="actions"><button onclick="prev()">← Back</button><button class="primary" onclick="next()">${step===6?'Finish unit':'Complete step & continue →'}</button></div>`;voiceControls();glossify($('app'))}

function playListening(i,rate){let item=listeningItem(i);sayLines([{text:item.x.a,role:'A'},{text:item.x.b,role:'B'}],rate)}
function autoStartActivity(){if(step===3)playListening(exercise);else if(step===4)speak(DIALOGUES[unit][sim%5].a,null,'A');else if(step===5)speak(speakingItems()[turn].a,null,'A')}
function nextListeningQuestion(){stop();if(exercise>=9){feedback='Has terminado las 10 preguntas de Listening.';render();return}exercise++;answer=null;render();playListening(exercise)}
function nextDialogueSituation(){stop();sim=(sim+1)%5;simAnswer=null;render();speak(DIALOGUES[unit][sim%5].a,null,'A')}
// Preguntas estables por ejercicio: las alternativas cambian de posición entre ejercicios
// y la respuesta correcta no depende de un índice fijo.
function listeningQuestion(i){
 const item=listeningItem(i), x=item.x;
 const all=DIALOGUES[unit].concat(EXTRA_DIALOGUES[unit]);
 const mode=i%3; // 0: respuesta de B; 1: intervención de A; 2: intención comunicativa
 let prompt,correct,distractors=[],explanation;
 if(mode===2){
   const t=x.a.trim().toLowerCase();
   let intent=null;
   if(/^(hi|hello|good morning|good afternoon|good evening|hey)\b/.test(t))intent='Saludar o iniciar una conversación';
   else if(/\b(thank you|thanks)\b/.test(t))intent='Expresar agradecimiento';
   else if(/^(where|when|what time|how much|how many|how old|how do|what is|what are|who|which)\b/.test(t))intent='Pedir información';
   else if(/^(can you|could you|please|would you mind)\b/.test(t))intent='Pedir ayuda o solicitar algo';
   else if(/^(would you like|do you want|can i get you)\b/.test(t))intent='Ofrecer algo o preguntar por una preferencia';
   if(intent){
     prompt='¿Qué intención comunicativa tiene la primera persona (A)?';
     correct=intent;
     distractors=['Saludar o iniciar una conversación','Expresar agradecimiento','Pedir información','Pedir ayuda o solicitar algo','Ofrecer algo o preguntar por una preferencia','Despedirse','Dar una opinión'].filter(v=>v!==correct);
     explanation='Fíjate en la intención de la primera intervención, no solo en una palabra aislada.';
   }
 }
 if(!correct){
   const who=mode===1?'a':'b';
   prompt=who==='a'?'¿Qué dijo la primera persona (A)?':'¿Qué respondió la segunda persona (B)?';
   correct=x[who];
   distractors=all.filter((v,k)=>k!==i).map(v=>v[who]).filter(v=>v!==correct);
   explanation=who==='a'?'La respuesta corresponde a la primera voz (A).':'La respuesta corresponde a la segunda voz (B).';
 }
 // Quitar duplicados y repartir alternativas. Se mantiene la misma selección al redibujar.
 const unique=[...new Set(distractors)];
 const seed=(unit+1)*101+(i+1)*37;
 const ranked=unique.map((v,k)=>({v,r:((k+1)*7919+seed*104729)%65521})).sort((a,b)=>a.r-b.r).map(o=>o.v);
 const picks=ranked.slice(0,2);
 // Si faltan alternativas válidas, se evita inventar datos sobre el diálogo.
 const opts=[correct,...picks];
 const correctIndex=(unit*3+i*2+Math.floor(i/3))%opts.length;
 opts.splice(0,1);opts.splice(correctIndex,0,correct);
 return {prompt,correct,opts,correctIndex,explanation};
}
function practice(u,d){
 const i=exercise,q=listeningQuestion(i),selected=answer;
 const correct=selected===q.correctIndex;
 return `<section class="card"><h1>Listening practice · ${i+1}/10</h1><p>Escucha a dos interlocutores. Responde sobre lo que dijeron o sobre la intención de la conversación. Las respuestas cambian de posición.</p><div class="actions"><button class="primary" onclick="playListening(${i})">↻ Repeat dialogue</button><button onclick="playListening(${i},.72)">▶ Slower</button></div><h3>${esc(q.prompt)}</h3>${q.opts.map((o,j)=>`<button class="choice" onclick="answer=${j};render()" ${selected===j?'aria-pressed="true"':''}>${selected===j?'●':'○'} ${esc(o)}</button>`).join('')}${selected!==null?`<div class="${correct?'good':'bad'}"><b>${correct?'Correct.':'No es la respuesta correcta.'}</b><p>${esc(q.explanation)}</p><p><b>Respuesta:</b> ${esc(q.correct)}</p></div>`:''}<div class="actions">${i<9?'<button onclick="nextListeningQuestion()">Next listening question · ▶ →</button>':'<span class="good">✓ 10/10 intercambios presentados. Continúa a Dialogue Simulation.</span>'}</div><p class="small muted">Escucharás siempre ambas voces (A y B). El siguiente diálogo comienza automáticamente al pulsar Next listening question. Para aprender mejor, intenta responder antes de revelar la solución.</p></section>`
}
function dialog(u,d){let x=d[sim%5],opts=[x.b,d[(sim+1)%5].b,d[(sim+2)%5].b];return `<section class="card"><h1>Dialogue simulation · ${sim%5+1}/5</h1><p>Escucha una voz y responde. La segunda voz reproduce el modelo después de tu elección.</p><button class="primary" onclick="speak(DIALOGUES[unit][sim%5].a,null,'A')">↻ Repetir interlocutor A</button><div class="dialog"><b>Speaker A</b><p>${esc(x.a)}</p></div><p>What would you say?</p>${opts.map((v,i)=>`<button class="choice" onclick="simAnswer=${i};speak(DIALOGUES[unit][sim%5].b,null,'B');render()">${simAnswer===i?'●':'○'} ${esc(v)}</button>`).join('')}${simAnswer!==null?`<div class="${simAnswer===0?'good':'bad'}">${simAnswer===0?'Appropriate response.':'This response belongs to a different exchange.'}<p>Model: ${esc(x.b)}</p><button onclick="sayLines([{text:DIALOGUES[unit][sim%5].a,role:'A'},{text:DIALOGUES[unit][sim%5].b,role:'B'}])">▶ Escuchar intercambio completo</button></div>`:''}<div class="actions"><button onclick="nextDialogueSituation()">Next situation · ▶ →</button></div></section>`}
let spokenTurn=false,recognitionPending=false,speakingComplete=false;
function yourTurn(u,d){if(speakingComplete)return `<section class="card"><h1>Speaking complete</h1><p>✓ Has realizado 10 respuestas orales. Puedes continuar a Review.</p><button onclick="speakingComplete=false;turn=0;conversationLog=[];render();autoStartActivity()">Repetir práctica</button></section>`;let x=speakingItems()[turn];return `<section class="card"><h1>Your turn · Speaking</h1><p><b>Primero habla.</b> Escucha a tu interlocutor y contesta oralmente en inglés. La escritura es una actividad adicional, no una alternativa al Speaking.</p><div class="row"><b>Intercambio ${turn+1} de 10</b><span class="muted">Conversación oral</span></div><div class="dialog"><b>🔊 Interlocutor</b><p>${esc(x.a)}</p><button class="primary" onclick="speak(speakingItems()[turn].a,null,'A')">▶ Escuchar</button></div>${conversationLog.map(item=>`<div class="dialog"><b>🎙 Tu respuesta oral</b><p>${esc(item.user)}</p></div>`).join('')}${speakingHints(x)}<div class="actions"><button class="primary" onclick="startMic()">🎙 Responder hablando</button><button onclick="speak(speakingItems()[turn].a,null,'A')">↻ Repetir pregunta</button></div><p id="speechStatus" class="hint" role="status">${esc(feedback||'Pulsa «Responder hablando» y autoriza el micrófono si se solicita.')}</p>${spokenTurn?`<div class="dialog"><b>Transcripción automática (puede contener errores)</b><p>${esc(heard)}</p></div><div class="actions"><button onclick="checkSpeech()">💬 Comentar mi respuesta</button><button onclick="speak(speakingItems()[turn].b,null,'B')">▶ Escuchar un modelo</button><button class="primary" onclick="advanceTurn()">Siguiente intercambio →</button></div><details><summary>✍ Practicar también por escrito (opcional)</summary><label for="writtenExtra">Escribe otra forma de responder</label><textarea id="writtenExtra" rows="2" placeholder="Optional writing practice"></textarea><p class="small muted">Este texto no se utiliza para acreditar Speaking.</p></details>`:`<p class="small muted">Para continuar es necesario que se reconozca una respuesta oral. Si el navegador no permite reconocimiento, prueba Edge o Chrome con permiso de micrófono. No se registrará una respuesta escrita como Speaking.</p>`}<p class="small muted">La evaluación del contenido es orientativa, no mide pronunciación. Son diez intercambios, cinco originales y cinco nuevos. El comentario es orientativo y no evalúa pronunciación.</p></section>`}
function startMic(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){feedback='Este navegador no ofrece reconocimiento de voz. Prueba Edge o Chrome y habilita el micrófono; no se puede completar este turno escribiendo.';render();return}try{stop();if(mic)try{mic.abort()}catch(e){};spokenTurn=false;recognitionPending=true;feedback='Escuchando... habla ahora en inglés.';render();mic=new SR();mic.lang='en-US';mic.interimResults=false;mic.maxAlternatives=1;mic.onresult=e=>{recognitionPending=false;heard=e.results[0][0].transcript.trim();spokenTurn=!!heard;feedback=spokenTurn?'Respuesta oral captada. Pulsa «Comentar mi respuesta» para recibir sugerencias sobre pertinencia y naturalidad.':'No se reconocieron palabras. Intenta de nuevo.';render()};mic.onerror=e=>{recognitionPending=false;spokenTurn=false;feedback='No se pudo reconocer tu voz ('+e.error+'). Comprueba permisos y vuelve a intentarlo.';render()};mic.onnomatch=()=>{recognitionPending=false;spokenTurn=false;feedback='No se reconoció una respuesta. Inténtalo de nuevo.';render()};mic.start()}catch(e){recognitionPending=false;spokenTurn=false;feedback='No fue posible activar el micrófono. Comprueba el permiso y vuelve a intentarlo.';render()}}
function normalized(t){return String(t||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function wordSet(t){return new Set(normalized(t).split(' ').filter(w=>w.length>2&&!['the','and','you','are','for','with','that','this','can','have','would','please'].includes(w)))}
function speakingHints(x){
 const terms=Array.from(wordSet(x.b)).filter(v=>!wordSet(x.a).has(v)).slice(0,5);
 const words=terms.length?terms.join(' · '):'yes · no · please · thanks';
 return `<div class="dialog"><b>💡 ¿Necesitas ayuda para responder?</b><p class="small muted">Intenta responder sin pistas primero. Puedes revelar ayudas gradualmente.</p><button onclick="hintLevel=Math.min(3,hintLevel+1);render()" ${hintLevel>=3?'disabled':''}>${hintLevel?'Otra pista':'Mostrar una pista'}</button>${hintLevel?`<button onclick="hintLevel=0;render()">Ocultar</button>`:''}${hintLevel>=1?`<p><b>1 · Vocabulario:</b> ${esc(words)}</p>`:''}${hintLevel>=2?`<p><b>2 · Estructura:</b> ${esc(speakingFrame(x.b))}</p>`:''}${hintLevel>=3?`<p><b>3 · Un ejemplo posible:</b> ${esc(x.b)}</p>`:''}</div>`;
}
function speakingFrame(model){
 let m=String(model||'');
 if(/^(I usually |I often |I sometimes )/i.test(m))return 'I usually + verbo + complemento';
 if(/^I('m| am) /i.test(m))return "I'm + descripción / sentimiento / lugar";
 if(/^I (like|want|need|work|live|go|study|have)\b/i.test(m))return 'I + verbo + complemento';
 if(/^(Yes|No)[,!. ]/i.test(m))return 'Yes / No + explicación breve';
 if(/^Can I |^Could I |^I'd like/i.test(m))return "Can I ...? / I'd like ...";
 return 'Responde con una frase breve y relacionada con la pregunta';
}
function speechAdvice(raw,prompt,model){
 const text=normalized(raw),question=normalized(prompt),expected=normalized(model);
 if(!text)return {kind:'retry',message:'No se reconoció una respuesta. Intenta de nuevo.'};
 const fixes=[
  [/\bi (?:have|am have) hungry\b/i,"I'm hungry",'Hungry es un adjetivo: en inglés se usa be, no have.'],
  [/\bi (?:have|am have) thirsty\b/i,"I'm thirsty",'Thirsty es un adjetivo: se usa be.'],
  [/\bi (?:am|\'m) agree\b/i,'I agree','Agree es un verbo; no necesita am.'],
  [/\bi (?:no|not) understand\b/i,"I don't understand",'Para negar el presente simple usa don’t + verbo.'],
  [/\bi(?:he|she) have\b/i,'He has / She has','Con he o she se usa has.'],
  [/\bi (?:am|\'m) from in\b/i,"I'm from ...",'Para indicar origen, from no lleva in.'],
  [/\bi have (\d{1,3}) years old\b/i,null,'Para expresar la edad se usa be, no have.'],
  [/\bi want water please\b/i,"I'd like some water, please",'Tu petición se entiende; I’d like resulta más cortés.']
 ];
 for(const [re,suggestion,reason] of fixes){const m=text.match(re);if(m){let corrected=suggestion||`I'm ${m[1]} years old`;return {kind:'correction',message:`Good try! Tu idea se entiende. Una forma más natural es “${corrected}”. ${reason} Intenta decirla nuevamente.`,suggestion:corrected}}}
 const w=wordSet(text),m=wordSet(expected),q=wordSet(question);
 const matches=[...w].filter(v=>m.has(v)).length;
 const related=[...w].filter(v=>q.has(v)).length;
 let pertinent=matches>0||related>0;
 let specific='';
 if(/what do you (usually )?do after work|what do you do after (school|class)/.test(question)){
   const activity=/\b(go home|head home|rest|relax|cook|study|exercise|walk|watch|read|sleep|eat|work out|play|visit|drive|take|clean|shop|meet|pick up)\b/.test(text);
   pertinent=activity;
   if(activity&&/\b(usually|often|sometimes|always|never)\b/.test(text))specific=' Usaste correctamente una expresión de frecuencia para describir tu rutina.';
   else if(activity)specific=' Explicaste una actividad después del trabajo de manera comprensible.';
 }
 else if(/how are you|how do you feel/.test(question))pertinent=/\b(fine|good|great|okay|ok|happy|sad|tired|hungry|thirsty|well|not bad)\b/.test(text);
 else if(/what(?: is|'s) your name/.test(question))pertinent=/\b(my name|i'm |i am |it's |it is )/.test(text);
 else if(/where are you from|where do you live/.test(question))pertinent=/\b(i'm from|i am from|i live|from )/.test(text);
 else if(/^(do you |can you |are you |would you |is it |have you )/.test(question))pertinent=/^(yes|no|sure|of course|not really|sometimes|i do|i don't|i can|i can't|i am|i'm|i would|i'd|sorry)/.test(text)||matches>0;
 else if(/what would you like|what do you want|can i get|anything else/.test(question))pertinent=/\b(i'd like|i would like|i want|can i have|can i get|coffee|tea|water|juice|sandwich|no thanks|that's it)\b/.test(text);
 const short=text.split(' ').length<2;
 if(pertinent){
  const openings=['Great answer!','Nice work!','Well done!','Good response!'];
  let msg=openings[(feedbackRotation++)%openings.length]+' Tu respuesta se relaciona con la pregunta y se entiende.'+specific;
  if(short)msg+=' Si quieres, puedes expresarla con una oración completa.';
  else if(text!==expected&&matches>0)msg+=' No necesitas repetir exactamente la respuesta modelo.';
  return {kind:'good',message:msg,pertinent:true};
 }
 return {kind:'uncertain',message:'Good effort! No puedo confirmar que la respuesta conteste exactamente la pregunta. Escucha de nuevo qué información solicita el interlocutor y vuelve a intentarlo. Si tu respuesta es válida, el reconocimiento automático puede no haberla interpretado bien.',pertinent:false};
}
function checkSpeech(){
 if(!spokenTurn){feedback='Primero responde oralmente con el micrófono.';render();return}
 const x=speakingItems()[turn],result=speechAdvice(heard,x.a,x.b);
 let extra='';
 if(result.kind==='good'&&normalized(heard)!==normalized(x.b))extra=' Si deseas ampliar tu respuesta, una posibilidad es: “'+x.b+'”. No es una corrección obligatoria.';
 else if(result.kind==='uncertain')extra=' Una respuesta de ejemplo es: “'+x.b+'”.';
 feedback=result.message+extra+' La evaluación es orientativa: no mide pronunciación y puede equivocarse por errores de transcripción.';
 render();
}
function advanceTurn(){if(!spokenTurn){feedback='Debes responder oralmente antes de avanzar.';render();return}let x=speakingItems()[turn];conversationLog.push({user:heard,model:x.b});if(turn>=9){feedback="Has completado los 10 turnos orales de esta unidad.";spokenTurn=false;speakingComplete=true;render();return}turn++;heard='';feedback='';hintLevel=0;spokenTurn=false;render();speak(speakingItems()[turn].a,null,'A')}
const EXTERNAL=[
{title:'VOA Learning English · Let’s Learn English',url:'https://learningenglish.voanews.com/p/5644.html',type:'Listening · American English',task:'Escucha una conversación y responde oralmente: What did the speakers say?'},
{title:'ELLLO · Beginner listening',url:'https://elllo.org/',type:'Listening · voces humanas',task:'Elige una conversación A1 y repite dos respuestas en voz alta.'},
{title:'Randall’s ESL Cyber Listening Lab',url:'https://www.esl-lab.com/',type:'Listening · comprensión',task:'Selecciona Easy, responde las preguntas y explica una respuesta en inglés.'},
{title:'British Council · A1 Listening',url:'https://learnenglish.britishcouncil.org/skills/listening/a1-listening',type:'Listening · inglés británico',task:'Escucha y compara las expresiones con el inglés estadounidense.'},
{title:'USA Learns',url:'https://www.usalearns.org/',type:'Listening + Speaking · vida y trabajo en EE. UU.',task:'Selecciona una lección inicial, escucha y practica oralmente las expresiones.'}
];
function externalPractice(){const work=unit>=20;return `<h3>External Practice · Listening & Speaking</h3><p class="small muted">Recursos gratuitos o con contenido gratuito en sus sitios originales. Son portales o cursos, no enlaces comprobados a una lección específica de este módulo. Elige material inicial y revisa el nivel antes de empezar.</p>${EXTERNAL.map(r=>`<div class="dialog"><b>${esc(r.title)}</b><p class="small muted">${esc(r.type)}</p><a target="_blank" rel="noopener noreferrer" href="${esc(r.url)}">Abrir recurso ↗</a><p><b>Actividad:</b> ${esc(r.task)}</p></div>`).join('')}<div class="hint"><b>Regreso a la aplicación:</b> responde oralmente a estas preguntas: ${work?'What do you do at work? · Can you ask for help?':'What did you hear? · Can you repeat one useful phrase?'} La aplicación no puede verificar el progreso dentro de páginas externas.</div>`}
function finish(u){return `<section class="card"><h1>Review & next steps</h1><p>¿Puedes comprender las expresiones de esta lección y responder sin leer?</p><div class="actions"><button onclick="playDialogue(3)">▶ Dialogue 4</button><button onclick="playDialogue(4)">▶ Dialogue 5</button></div><h3>Spaced review</h3><button onclick="db.review[unit]=Date.now();save();alert('Review scheduled in this browser.')">Schedule review</button>${externalPractice()}<p class="hint">Sugerencia: 8 minutos escuchando, 7 hablando, 3 repasando y 2 leyendo o escribiendo.</p></section>`}

function showReview(){let now=Date.now(),due=Object.entries(db.review).filter(([i,t])=>now-Number(t)>=86400000);$('app').innerHTML=`<section class="card"><h1>Spaced review</h1><p>Unidades marcadas para repasar y con al menos un día transcurrido: ${due.length}</p>${due.map(([i,t])=>`<p><button onclick="openUnit(${i},3)">${esc(UNITS[i].title)} → Practice</button></p>`).join('')||'<p>No reviews due yet. Complete a unit and schedule its review.</p>'}<button onclick="showHome()">Back to units</button></section>`}
showHome();
</script></body></html>
